[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coderefactor-pilot"
version = "1.0.0"
description = "AI-Powered Code Review & Intelligent Refactoring Engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "CodeRefactor Pilot Team"},
]
keywords = ["code-review", "refactoring", "static-analysis", "code-quality", "lint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
coderefactor-pilot = "coderefactor_pilot.cli:main"

[tool.setuptools]
packages = ["coderefactor_pilot", "coderefactor_pilot.analyzer", "coderefactor_pilot.rules",
            "coderefactor_pilot.ai", "coderefactor_pilot.git", "coderefactor_pilot.reporter",
            "coderefactor_pilot.tui", "coderefactor_pilot.utils"]
